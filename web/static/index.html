<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Генератор расписания - имитация отжига</title>
    <link rel="stylesheet" href="/styles.css?v=20260705-modern" />
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js" defer></script>
    <script src="/app.js?v=20260705-modern" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">SA</div>
          <div>
            <h1>Генератор расписания</h1>
            <p>Имитация отжига и метрики расписания</p>
          </div>
        </div>
        <div class="toolbar">
          <button id="import-json" class="tool-button" type="button" title="Импортировать JSON">
            <i data-lucide="upload"></i><span>Импорт</span>
          </button>
          <button id="export-json" class="tool-button" type="button" title="Экспортировать JSON">
            <i data-lucide="download"></i><span>Экспорт</span>
          </button>
          <button id="generate" class="primary-button" type="button" title="Составить расписание">
            <i data-lucide="play"></i><span>Составить</span>
          </button>
          <input id="json-file" type="file" accept="application/json" hidden />
        </div>
      </header>

      <main class="workspace">
        <section class="control-panel">
          <label class="dataset-control">
            <span>Выбор пресета</span>
            <select id="dataset-select"></select>
          </label>
          <button id="load-dataset" class="tool-button" type="button" title="Загрузить выбранный датасет">
            <i data-lucide="database"></i><span>Загрузить</span>
          </button>
          <label>
            <span>Итерации</span>
            <input id="iterations" type="number" min="100" step="100" value="8000" />
          </label>
          <label>
            <span>Температура</span>
            <input id="temperature" type="number" min="1" step="10" value="150" />
          </label>
          <label>
            <span>Охлаждение</span>
            <input id="cooling" type="number" min="0.9" max="0.9999" step="0.0005" value="0.997" />
          </label>
        </section>

        <section class="preset-panel">
          <div class="preset-head">
            <h2>Пресеты</h2>
            <span>Готовые сценарии для теста алгоритмов и метрик</span>
          </div>
          <div id="preset-list" class="preset-list"></div>
        </section>

        <div id="status" class="status" role="status"></div>

        <section class="metrics" id="metrics"></section>

        <div class="content-grid">
          <aside class="data-panel">
            <div class="panel-head">
              <div>
                <h2>Исходные данные</h2>
                <p id="dataset-summary"></p>
              </div>
              <button id="add-row" class="icon-button" type="button" title="Добавить строку">
                <i data-lucide="plus"></i>
              </button>
            </div>
            <div id="tabs" class="tabs" role="tablist"></div>
            <div id="editor" class="editor"></div>
          </aside>

          <section class="results-stack">
            <section class="schedule-section">
              <div class="section-head">
                <h2>Расписание</h2>
                <span id="schedule-count" class="section-count"></span>
              </div>
              <div id="schedule" class="schedule-grid"></div>
            </section>

            <section class="bottom-grid">
              <div class="list-panel">
                <div class="section-head">
                  <h2>Конфликты</h2>
                  <span id="conflict-count" class="section-count"></span>
                </div>
                <div id="conflicts" class="event-list"></div>
              </div>
              <div class="list-panel">
                <div class="section-head">
                  <h2>Не размещено</h2>
                  <span id="unscheduled-count" class="section-count"></span>
                </div>
                <div id="unscheduled" class="event-list"></div>
              </div>
            </section>
          </section>
        </div>
      </main>
    </div>
  </body>
</html>
